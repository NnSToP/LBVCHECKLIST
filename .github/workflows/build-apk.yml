name: Build APK RadioGroupe

on:
  push:
    branches: [radiogroupe]
    paths-ignore: ['apk/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        id: build
        continue-on-error: true
        working-directory: RadioGroupe
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Save APK and log to the branch
        if: always()
        shell: bash
        run: |
          mkdir -p apk
          rm -f apk/*
          cp build.log apk/build.log || true
          if [ -f RadioGroupe/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp RadioGroupe/app/build/outputs/apk/debug/app-debug.apk apk/RadioGroupe.apk
            echo "OK" > apk/status.txt
          else
            echo "FAILED" > apk/status.txt
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add apk
          git commit -m "APK build result [skip ci]" || exit 0
          git push
